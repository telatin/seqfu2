path = "$projectPath/src/lib/"
--path:"./src/lib/"
--opt:speed
-d:release
# -d:danger disables runtime checks (bounds, overflow, nil). This is deliberate:
# it is ~20% faster on per-base commands such as `seqfu rc`, at the cost of
# undefined behaviour instead of a clean error on internal bugs. Compile with
# --checks:on to debug. Do not add -march=native here: it gave no measurable
# gain and makes distributed binaries CPU-specific.
-d:danger

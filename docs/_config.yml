# SeqFu documentation site
# Built by GitHub Pages (Jekyll 3.x, github-pages gem). No custom Ruby plugins:
# all listings, filters and search indexes are generated with plain Liquid.

title: SeqFu
description: A suite of utilities for the robust and reproducible manipulation of FASTA and FASTQ files
url: "https://telatin.github.io"
baseurl: "/seqfu2"
repository: telatin/seqfu2

# Shown in the hero and in the install box. Keep in sync with seqfu.nimble.
seqfu_version: "1.30.0"

github_url: "https://github.com/telatin/seqfu2"
bioconda_url: "https://anaconda.org/bioconda/seqfu"
mastodon_url: "https://mas.to/@seqfu"
doi: "10.3390/bioengineering8050059"

# Optional analytics (see _includes/analytics.html)
# gtag4: G-XXXXXXXXXX

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jemoji
  - jekyll-relative-links

# Front matter defaults: the folder a page lives in decides what it is.
#   tools/*.md      -> a `seqfu <command>` page      (kind: core)
#   utilities/*.md  -> a standalone `fu-*` program   (kind: utility)
#   recipes/*.md    -> a tutorial                    (layout: recipe)
#   apps/*.html     -> an in-browser tool            (layout: app)
defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "tools" }
    values: { layout: tool, kind: core, language: nim }
  - scope: { path: "utilities" }
    values: { layout: tool, kind: utility, language: nim }
  - scope: { path: "recipes" }
    values: { layout: recipe, section: recipes }
  - scope: { path: "apps" }
    values: { layout: app, section: apps }
  - scope: { path: "getting-started" }
    values: { section: getting-started }
  - scope: { path: "about" }
    values: { section: about }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - existing-website
  - mock-template.html
  - support.js
  - node_modules
  - vendor
  - .thumbnail
  - "*.afdesign"

# Folder of this site inside the repository, used for "Edit this page" links.
docs_dir: docs

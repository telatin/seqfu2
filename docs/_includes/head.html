<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<link rel="preload" as="style" href="{{ '/assets/css/main.css' | relative_url }}" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}"></noscript>
<style>
/* Critical above-the-fold styles — inlined to eliminate render-blocking CSS */
*,*::before,*::after{box-sizing:border-box}
:root{--purple:#72439A;--purple-dark:#4E2A6E;--amber:#FFBF00;--bg:#FAF9FB;--surface:#FFFFFF;--ink:#16121A;--ink-3:#4A4250;--muted:#6B6272;--muted-2:#8A8190;--border:#E2DCE8;--term-bg:#000000;--term-ink:#EDE7F2;--term-border:#2A2230;--sans:'Public Sans',Helvetica,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--topbar-h:60px}
html{scroll-padding-top:calc(var(--topbar-h) + 20px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--purple);text-decoration:none}
[hidden]{display:none!important}
.topbar{position:fixed;inset:0 0 auto 0;z-index:50;height:var(--topbar-h);background:#000;border-bottom:3px solid var(--purple);display:flex;align-items:center;gap:16px;padding:0 20px}
.topbar-spacer{height:calc(var(--topbar-h) + 3px)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand:hover{text-decoration:none}
.brand-logo{display:block;width:32px;height:32px;border-radius:4px}
.brand-name{color:#fff;font-weight:800;font-size:18px;letter-spacing:-.01em}
.topnav{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.topnav a{position:relative;padding:20px 10px;color:#D9D2E0;font-size:14px;font-weight:500;white-space:nowrap}
.nav-toggle{display:none}
.search{position:relative;width:clamp(160px,18vw,300px);flex-shrink:0}
.search input{width:100%;height:36px;border-radius:6px;border:1px solid #3A2F42;background:var(--ink);color:#fff;padding:0 40px 0 12px;font:inherit;font-size:14px;outline:none}
.btn-install{flex-shrink:0;background:var(--amber);color:#000;font-weight:700;font-size:13px;padding:8px 14px;border-radius:6px}
</style>
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<script>window.SEQFU = { baseurl: "{{ site.baseurl }}", searchIndex: "{{ '/assets/search.json' | relative_url }}" };</script>
<script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
{% include analytics.html %}
